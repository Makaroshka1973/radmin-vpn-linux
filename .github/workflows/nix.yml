name: Nix Build

on:
  push:

jobs:
  nix-build:
    runs-on: ubuntu-latest
    steps:
    - name: Check repository
      uses: actions/checkout@v4

    - name: Install Nix
      uses: cachix/install-nix-action@v25
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Run Nix Build
      run: nix build
